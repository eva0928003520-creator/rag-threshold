<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG拒答門檻</title>
<style>
  :root {
    --bg: #F3F6EC;
    --card: #FFFFFF;
    --ink: #13212E;
    --muted: #66756C;
    --line: #DCE4CE;
    --brick: #13212E;      /* 高於門檻：系統會回答（深藍） */
    --olive: #5E8C2A;
    --lime: #D6E88A;
    --rust: #9A3E22;
    --brick-dark: #0B1620;
    --sand: #B5C2A2;       /* 低於門檻：系統拒答（灰綠） */
    --rust-soft: #EEF4E2;
    --ok: #4E7A22;
    --warn: #9A3E22;
    --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100vh; }

  header { padding: 28px 32px 8px; max-width: 1480px; margin: 0 auto; }
  .kicker { font-size: 12px; letter-spacing: .18em; color: var(--olive); font-weight: 700; text-transform: uppercase; }
  h1 { font-family: var(--serif); font-size: 38px; line-height: 1.2; margin: 6px 0 10px; font-weight: 700; }
  #conclusion { font-family: var(--serif); font-size: 18px; line-height: 1.65; color: #2F3D47; max-width: 980px; margin: 0; }
  #conclusion b { color: var(--olive); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; padding: 18px 32px 32px; max-width: 1480px; margin: 0 auto; align-items: start; }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 1px 2px rgba(19,33,46,.05), 0 8px 24px rgba(19,33,46,.07); border: 1px solid var(--line); }

  /* 圖表區 */
  .chart-card { padding: 18px 20px 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; }
  .tabs { display: inline-flex; background: #E4EDD2; border-radius: 999px; padding: 4px; }
  .tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font: inherit; font-size: 14px; color: var(--brick-dark); cursor: pointer; }
  .tabs button.active { background: var(--brick); color: #fff; box-shadow: 0 1px 3px rgba(19,33,46,.3); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .stat b { font-family: var(--serif); font-size: 19px; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
  .stat.bad b { color: var(--warn); }
  .stat.good b { color: var(--ok); }

  .slider-row { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .slider-row input[type=range] { flex: 1; accent-color: var(--brick); }
  #thrValue { font-family: var(--serif); font-size: 20px; color: var(--rust); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--olive); background: #F5F9EC; }
  .btn.on { background: var(--brick); border-color: var(--brick); color: #fff; }

  svg#chart { width: 100%; height: auto; display: block; margin-top: 4px; user-select: none; }
  .axis text { font-size: 11px; fill: var(--muted); font-family: var(--sans); }
  .axis line, .axis path { stroke: var(--line); }
  .row-label { font-family: var(--serif); font-size: 15px; fill: var(--ink); font-weight: 700; }
  .row-sub { font-size: 11px; fill: var(--muted); }
  .row-bg { fill: #F2F6E8; }
  .dot { transition: r .12s, stroke-width .12s, opacity .2s; }
  .hit { fill: transparent; cursor: pointer; }
  .thr-line { stroke: var(--rust); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .thr-handle { fill: var(--rust); cursor: ew-resize; }
  .thr-label { font-family: var(--serif); font-size: 13px; fill: var(--rust); font-weight: 700; }
  .side-label { font-size: 11px; fill: var(--muted); letter-spacing: .08em; }
  .gray-band { fill: rgba(214,232,138,.45); }
  .wrong-ring { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 2.5 2; pointer-events: none; }
  .brush-rect { fill: rgba(94,140,42,.10); stroke: var(--olive); stroke-dasharray: 4 3; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .footnote { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }

  /* 右側面板 */
  aside.panel { position: sticky; top: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; }
  .panel-tabs { display: flex; border-bottom: 1px solid var(--line); }
  .panel-tabs button { flex: 1; border: 0; background: transparent; padding: 13px 8px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tabs button.active { color: var(--olive); border-bottom-color: var(--olive); font-weight: 700; }
  .panel-body { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
  .empty { color: var(--muted); font-size: 14px; line-height: 1.7; }
  .pid { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pid .id { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--olive); }
  .pill { font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); background: #fff; }
  .pill.lock { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pill.real { border-color: #A9C47E; color: var(--ok); background: #F3F8E6; }
  .pill.demo { border-color: #D8B3A2; color: var(--rust); }
  .question { font-family: var(--serif); font-size: 19px; line-height: 1.55; margin: 10px 0 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--rust-soft); color: var(--ink); }
  .tag.dyn-ok { background: #E6F0D3; color: var(--ok); }
  .tag.dyn-bad { background: #F4DED4; color: var(--warn); font-weight: 700; }
  .tag.neutral { background: #EDF1E6; color: #4F5E56; }
  h3 { font-family: var(--serif); font-size: 15px; margin: 18px 0 8px; color: var(--ink); }
  .score { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .score.current { border-color: var(--olive); box-shadow: 0 0 0 2px rgba(94,140,42,.12); }
  .score .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .score .val { font-family: var(--serif); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 8px; background: #EAF0DF; border-radius: 4px; margin: 8px 0 6px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--rust); }
  .score .verdict { font-size: 12px; }
  .top3 { list-style: none; padding: 0; margin: 0; counter-reset: t; }
  .top3 li { border-left: 3px solid var(--line); padding: 6px 0 8px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.55; }
  .top3 li.exp { border-left-color: var(--ok); }
  .top3 .meta { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .top3 .txt { color: var(--ink); word-break: break-word; }
  .list-head { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .brush-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid transparent; }
  .brush-item:hover, .brush-item.active { background: #F3F8E6; border-color: var(--line); }
  .brush-item .bid { font-family: var(--serif); color: var(--olive); font-weight: 700; }
  .brush-item .bq { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brush-item .bs { font-variant-numeric: tabular-nums; color: var(--muted); }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
    aside.panel { position: static; height: 560px; }
  }
</style>
</head>
<body>
<header>
  <div class="kicker">補對了嗎？· RAG 檢索評估</div>
  <h1>RAG拒答門檻</h1>
  <p id="conclusion"></p>
</header>

<main>
  <section class="card chart-card">
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button data-metric="vec" class="active">向量相似度</button>
      </div>
      <div class="stats">
        <div class="stat good" id="statA"></div>
        <div class="stat good" id="statR"></div>
        <div class="stat" id="statW"></div>
      </div>
    </div>

    <div class="slider-row">
      <span>門檻</span>
      <input type="range" id="thr" min="0.4" max="0.8" step="0.001">
      <span id="thrValue"></span>
    </div>

    <div class="buttons">
      <button class="btn" id="btnGray">僅選灰色地帶</button>
      <button class="btn" id="btnWrong">圈出判斷錯的題</button>
      <button class="btn" id="btnBrush">框選模式</button>
      <button class="btn" id="btnClear">清除選取</button>
      <button class="btn" id="btnReset">門檻還原</button>
    </div>

    <svg id="chart" viewBox="0 0 860 470" aria-label="各題分數蜂群圖"></svg>

    <div class="legend">
      <span><i style="background:var(--brick)"></i>高於門檻：系統會回答</span>
      <span><i style="background:var(--sand)"></i>低於門檻：系統拒答</span>
      <span><i style="border:1.4px dashed var(--ink);background:transparent"></i>判斷錯（開啟「圈出判斷錯的題」）</span>
    </div>
    <div class="footnote" id="footnote"></div>
  </section>

  <aside class="card panel">
    <div class="panel-tabs">
      <button data-ptab="detail" class="active">詳細資料</button>
      <button data-ptab="brush">框選清單 <span id="brushCount"></span></button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</main>

(() => {
  const CATS = [
    { key: '健康問題', sub: '應回答' },
    { key: '個人/即時', sub: '應拒答' },
    { key: '無關健康', sub: '應拒答' },
    { key: '打招呼/亂打', sub: '應拒答' },
  ];
  const METRICS = {
    vec:    { label: '向量相似度',   field: 'vecScore',    domain: [0.4, 0.8], defaultThr: 0.59, step: 0.001, band: 0.03,  fmt: v => v.toFixed(3) },
  };
  const W = 860, H = 470, M = { l: 132, r: 28, t: 40, b: 44 };
  const IW = W - M.l - M.r, IH = H - M.t - M.b, ROW = IH / CATS.length;
  const R = 5.5, HIT = R + 4;          // 視覺半徑 5.5px，感應半徑大 4px
  const NS = 'http://www.w3.org/2000/svg';
  const COLOR_ON = getComputedStyle(document.documentElement).getPropertyValue('--brick').trim();
  const COLOR_OFF = getComputedStyle(document.documentElement).getPropertyValue('--sand').trim();

  const state = {
    metric: 'vec',
    thr: { vec: METRICS.vec.defaultThr },
    hover: null, shown: null, locked: null,
    gray: false, wrong: false, brushMode: false,
    brushed: [], ptab: 'detail',
  };

  const byId = Object.fromEntries(DATA.map(d => [d.id, d]));
  const svg = document.getElementById('chart');
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const xScale = (m, v) => {
    const [a, b] = METRICS[m].domain;
    return M.l + (Math.max(a, Math.min(b, v)) - a) / (b - a) * IW;
  };
  const xInvert = (m, px) => {
    const [a, b] = METRICS[m].domain;
    return a + (px - M.l) / IW * (b - a);
  };
  const score = (d, m = state.metric) => d[METRICS[m].field];
  const answered = (d, m = state.metric) => score(d, m) >= state.thr[m];
  const isWrong = (d, m = state.metric) => answered(d, m) !== (d.expected === 'answer');

  /* ---------- 蜂群排列：每個指標各算一次位置 ---------- */
  function beeswarm(m) {
    const pos = {};
    CATS.forEach((c, ci) => {
      const cy = M.t + ROW * ci + ROW / 2, maxOff = ROW / 2 - R - 3;
      const pts = DATA.filter(d => d.category === c.key)
        .map(d => ({ id: d.id, x: xScale(m, score(d, m)) }))
        .sort((a, b) => a.x - b.x);
      const placed = [], gap = 2 * R + 1.2;
      for (const p of pts) {
        const near = placed.filter(q => Math.abs(q.x - p.x) < gap);
        let best = 0;
        for (let k = 0; k < 400; k++) {
          const off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 1.5;
          if (near.every(q => Math.hypot(q.x - p.x, q.off - off) >= gap)) { best = off; break; }
        }
        best = Math.max(-maxOff, Math.min(maxOff, best));
        placed.push({ x: p.x, off: best });
        pos[p.id] = { x: p.x, y: cy + best };
      }
    });
    return pos;
  }
  const POS = { vec: beeswarm('vec') };
  const cur = {};
  DATA.forEach(d => cur[d.id] = { ...POS.vec[d.id] });

  /* ---------- 靜態圖層 ---------- */
  const gRows = el('g', {}, svg), gAxis = el('g', { class: 'axis' }, svg);
  const gBand = el('g', {}, svg), gThrBack = el('g', {}, svg);
  const gDots = el('g', {}, svg), gRings = el('g', {}, svg);
  const gThr = el('g', {}, svg), gBrush = el('g', {}, svg);

  CATS.forEach((c, i) => {
    const y = M.t + ROW * i;
    el('rect', { class: 'row-bg', x: M.l, y: y + 4, width: IW, height: ROW - 8, rx: 10 }, gRows);
    const t = el('text', { class: 'row-label', x: M.l - 14, y: y + ROW / 2 - 2, 'text-anchor': 'end' }, gRows);
    t.textContent = c.key;
    const n = DATA.filter(d => d.category === c.key).length;
    const s = el('text', { class: 'row-sub', x: M.l - 14, y: y + ROW / 2 + 15, 'text-anchor': 'end' }, gRows);
    s.textContent = `${c.sub}・${n} 題`;
  });

  function drawAxis() {
    gAxis.innerHTML = '';
    const m = state.metric, [a, b] = METRICS[m].domain;
    const step = m === 'vec' ? 0.05 : 0.1;
    el('line', { x1: M.l, x2: M.l + IW, y1: H - M.b + 2, y2: H - M.b + 2 }, gAxis);
    for (let v = a; v <= b + 1e-9; v += step) {
      const x = xScale(m, v);
      el('line', { x1: x, x2: x, y1: H - M.b + 2, y2: H - M.b + 7 }, gAxis);
      const t = el('text', { x, y: H - M.b + 21, 'text-anchor': 'middle' }, gAxis);
      t.textContent = v.toFixed(2);
    }
    const title = el('text', { x: M.l + IW, y: H - 6, 'text-anchor': 'end' }, gAxis);
    title.textContent = `${METRICS[m].label} →`;
  }

  /* ---------- 點 ---------- */
  const nodes = {};
  DATA.forEach(d => {
    const g = el('g', { 'data-id': d.id }, gDots);
    const dot = el('circle', { class: 'dot', r: R, 'fill-opacity': 0.78, stroke: '#fff', 'stroke-width': 0.8 }, g);
    const hit = el('circle', { class: 'hit', r: HIT }, g);
    hit.addEventListener('pointerenter', () => onHover(d.id));
    hit.addEventListener('pointerleave', () => onLeave(d.id));
    hit.addEventListener('click', e => { e.stopPropagation(); onClick(d.id); });
    const ring = el('circle', { class: 'wrong-ring', r: R + 4, display: 'none' }, gRings);
    nodes[d.id] = { g, dot, hit, ring };
  });

  /* ---------- 門檻線（可拖曳） ---------- */
  const band = el('rect', { class: 'gray-band', y: M.t, height: IH, display: 'none' }, gBand);
  const thrLine = el('line', { class: 'thr-line', y1: M.t - 8, y2: H - M.b + 2 }, gThr);
  const thrHandle = el('rect', { class: 'thr-handle', y: M.t - 26, width: 12, height: 18, rx: 3 }, gThr);
  const thrLabel = el('text', { class: 'thr-label', y: M.t - 12 }, gThr);
  const leftLbl = el('text', { class: 'side-label', y: M.t - 12, 'text-anchor': 'end' }, gThr);
  const rightLbl = el('text', { class: 'side-label', y: M.t - 12 }, gThr);
  leftLbl.textContent = '← 拒答'; rightLbl.textContent = '會回答 →';
  let dragging = false;
  thrHandle.addEventListener('pointerdown', e => { dragging = true; thrHandle.setPointerCapture(e.pointerId); e.stopPropagation(); });
  thrHandle.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = svgPoint(e);
    setThr(xInvert(state.metric, p.x));
  });
  thrHandle.addEventListener('pointerup', () => dragging = false);

  function svgPoint(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  /* ---------- 框選 ---------- */
  const brushOverlay = el('rect', { x: M.l, y: M.t, width: IW, height: IH, fill: 'transparent', display: 'none', style: 'cursor:crosshair' }, gBrush);
  const brushRect = el('rect', { class: 'brush-rect', display: 'none' }, gBrush);
  let bStart = null;
  brushOverlay.addEventListener('pointerdown', e => {
    bStart = svgPoint(e); brushOverlay.setPointerCapture(e.pointerId);
    Object.assign(brushRect.style, {}); brushRect.setAttribute('display', '');
    setRect(bStart, bStart);
  });
  brushOverlay.addEventListener('pointermove', e => { if (bStart) setRect(bStart, svgPoint(e)); });
  brushOverlay.addEventListener('pointerup', e => {
    if (!bStart) return;
    const p = svgPoint(e);
    const x0 = Math.min(bStart.x, p.x), x1 = Math.max(bStart.x, p.x);
    const y0 = Math.min(bStart.y, p.y), y1 = Math.max(bStart.y, p.y);
    bStart = null;
    if (x1 - x0 < 3 && y1 - y0 < 3) { brushRect.setAttribute('display', 'none'); return; }
    state.brushed = DATA.filter(d => { const c = cur[d.id]; return c.x >= x0 - R && c.x <= x1 + R && c.y >= y0 - R && c.y <= y1 + R; })
      .sort((a, b) => score(b) - score(a)).map(d => d.id);
    setPtab('brush');
    render();
  });
  function setRect(a, b) {
    brushRect.setAttribute('x', Math.min(a.x, b.x)); brushRect.setAttribute('y', Math.min(a.y, b.y));
    brushRect.setAttribute('width', Math.abs(a.x - b.x)); brushRect.setAttribute('height', Math.abs(a.y - b.y));
  }

  /* ---------- 互動 ---------- */
  function onHover(id) {
    state.hover = id;
    if (!state.locked) state.shown = id;
    render();
  }
  function onLeave(id) {
    if (state.hover === id) state.hover = null;   // 面板保留最後一次 hover 的點
    render();
  }
  function onClick(id) {
    if (state.locked === id) { state.locked = null; }
    else { state.locked = id; state.shown = id; }
    if (state.ptab !== 'detail') setPtab('detail');
    render();
  }
  function setThr(v) {
    const m = METRICS[state.metric];
    const [a, b] = m.domain;
    v = Math.round(Math.max(a, Math.min(b, v)) / m.step) * m.step;
    state.thr[state.metric] = +v.toFixed(3);
    render();
  }

  const slider = document.getElementById('thr');
  slider.addEventListener('input', () => setThr(+slider.value));

  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => switchMetric(b.dataset.metric)));
  document.querySelectorAll('.panel-tabs button').forEach(b => b.addEventListener('click', () => { setPtab(b.dataset.ptab); render(); }));
  const toggle = (id, key, after) => document.getElementById(id).addEventListener('click', () => { state[key] = !state[key]; after && after(); render(); });
  toggle('btnGray', 'gray');
  toggle('btnWrong', 'wrong');
  toggle('btnBrush', 'brushMode', () => { state.hover = null; if (!state.brushMode) brushRect.setAttribute('display', state.brushed.length ? '' : 'none'); });
  document.getElementById('btnClear').addEventListener('click', clearSelection);
  document.getElementById('btnReset').addEventListener('click', () => { state.thr[state.metric] = METRICS[state.metric].defaultThr; render(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearSelection(); });

  function clearSelection() {
    state.locked = null; state.brushed = []; state.gray = false;
    brushRect.setAttribute('display', 'none');
    render();
  }
  function setPtab(t) {
    state.ptab = t;
    document.querySelectorAll('.panel-tabs button').forEach(b => b.classList.toggle('active', b.dataset.ptab === t));
  }

  let anim = null;
  function switchMetric(m) {
    if (m === state.metric) return;
    state.metric = m;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.metric === m));
    brushRect.setAttribute('display', 'none'); state.brushed = [];
    const from = {}; DATA.forEach(d => from[d.id] = { ...cur[d.id] });
    const t0 = performance.now(), dur = 700;
    cancelAnimationFrame(anim);
    drawAxis(); render();
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      DATA.forEach(d => {
        const a = from[d.id], b = POS[m][d.id];
        cur[d.id].x = a.x + (b.x - a.x) * e; cur[d.id].y = a.y + (b.y - a.y) * e;
      });
      placeDots();
      if (t < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  function placeDots() {
    DATA.forEach(d => {
      const { x, y } = cur[d.id], n = nodes[d.id];
      for (const c of [n.dot, n.hit, n.ring]) { c.setAttribute('cx', x); c.setAttribute('cy', y); }
    });
  }

  /* ---------- 主要繪製 ---------- */
  function render(skipPanel) {
    const m = state.metric, cfg = METRICS[m], thr = state.thr[m];
    const tx = xScale(m, thr);

    // 滑桿
    slider.min = cfg.domain[0]; slider.max = cfg.domain[1]; slider.step = cfg.step; slider.value = thr;
    document.getElementById('thrValue').textContent = cfg.fmt(thr);

    // 門檻線
    thrLine.setAttribute('x1', tx); thrLine.setAttribute('x2', tx);
    thrHandle.setAttribute('x', tx - 6);
    thrLabel.setAttribute('x', tx + 10); thrLabel.textContent = `門檻 ${cfg.fmt(thr)}`;
    leftLbl.setAttribute('x', tx - 10);
    rightLbl.setAttribute('x', tx + 92);
    leftLbl.setAttribute('display', tx - M.l > 60 ? '' : 'none');
    rightLbl.setAttribute('display', M.l + IW - tx > 140 ? '' : 'none');

    // 灰色地帶
    const lo = thr - cfg.band, hi = thr + cfg.band;
    band.setAttribute('display', state.gray ? '' : 'none');
    band.setAttribute('x', xScale(m, lo)); band.setAttribute('width', xScale(m, hi) - xScale(m, lo));

    // 統計
    const ans = DATA.filter(d => d.expected === 'answer'), ref = DATA.filter(d => d.expected === 'refuse');
    const a = ans.filter(d => answered(d)).length, r = ref.filter(d => !answered(d)).length;
    const w = DATA.filter(d => isWrong(d)).length;
    setStat('statA', a, ans.length, '可回答有回答');
    setStat('statR', r, ref.length, '應拒答有拒答');
    const sw = document.getElementById('statW');
    sw.innerHTML = `<b>${w}</b>題判斷錯`; sw.className = 'stat ' + (w ? 'bad' : 'good');

    // 點的樣式
    const brushedSet = new Set(state.brushed);
    DATA.forEach(d => {
      const n = nodes[d.id], s = score(d);
      const active = d.id === state.hover || d.id === state.locked || d.id === state.shown && !state.hover;
      const inGray = s >= lo && s <= hi;
      const dim = (state.gray && !inGray) || (state.brushed.length && !brushedSet.has(d.id));
      n.dot.setAttribute('fill', answered(d) ? COLOR_ON : COLOR_OFF);
      n.dot.setAttribute('r', active ? R + 3.5 : R);
      n.dot.setAttribute('stroke', active || brushedSet.has(d.id) ? (answered(d) ? '#D6E88A' : '#13212E') : '#fff');
      n.dot.setAttribute('stroke-width', d.id === state.locked ? 2.6 : active ? 2 : brushedSet.has(d.id) ? 1.2 : 0.8);
      n.dot.style.opacity = dim ? 0.13 : 1;
      n.hit.style.pointerEvents = state.brushMode ? 'none' : 'all';
      n.ring.setAttribute('display', state.wrong && isWrong(d) && !dim ? '' : 'none');
      if (active && n.g !== gDots.lastChild) gDots.appendChild(n.g);   // 移到最上層
    });
    placeDots();

    // 按鈕狀態
    document.getElementById('btnGray').classList.toggle('on', state.gray);
    document.getElementById('btnWrong').classList.toggle('on', state.wrong);
    document.getElementById('btnBrush').classList.toggle('on', state.brushMode);
    brushOverlay.setAttribute('display', state.brushMode ? '' : 'none');
    document.getElementById('brushCount').textContent = state.brushed.length ? `(${state.brushed.length})` : '';

    if (!skipPanel) renderPanel();
  }

  function setStat(id, n, total, label) {
    const e = document.getElementById(id);
    e.innerHTML = `<b>${n}/${total}</b>${label}`;
    e.className = 'stat ' + (n === total ? 'good' : 'bad');
  }

  /* ---------- 右側面板 ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const panel = document.getElementById('panelBody');

  function renderPanel() {
    if (state.ptab === 'brush') return renderBrushList();
    const id = state.locked || state.shown;
    if (!id) {
      panel.innerHTML = `<p class="empty">把滑鼠移到任一個點，這裡會顯示該題的題目、向量相似度與門檻的比較，以及檢索到的前 3 段原文。<br><br>點一下可以<b>鎖定</b>；再點一次或按「清除選取」（Esc）解除。</p>`;
      return;
    }
    panel.innerHTML = detailHTML(byId[id]);
  }

  function scoreBlock(d, m) {
    const cfg = METRICS[m], s = score(d, m), thr = state.thr[m];
    const pct = v => ((Math.max(cfg.domain[0], Math.min(cfg.domain[1], v)) - cfg.domain[0]) / (cfg.domain[1] - cfg.domain[0]) * 100).toFixed(1);
    const ans = s >= thr, ok = ans === (d.expected === 'answer');
    const diff = s - thr;
    return `<div class="score ${m === state.metric ? 'current' : ''}">
      <div class="top"><span>${cfg.label}${m === state.metric ? '（目前檢視）' : ''}</span><span class="val">${cfg.fmt(s)}</span></div>
      <div class="bar"><div class="fill" style="width:${pct(s)}%;background:${ans ? COLOR_ON : COLOR_OFF}"></div><div class="mark" style="left:${pct(thr)}%"></div></div>
      <div class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--warn)'}">
        門檻 ${cfg.fmt(thr)}，${diff >= 0 ? '高' : '低'} ${Math.abs(diff).toFixed(3)} → 系統${ans ? '會回答' : '拒答'}　${ok ? '✓ 判斷正確' : '✗ 判斷錯'}
      </div></div>`;
  }

  function dynTags(d) {
    const out = [];
    for (const m of ['vec']) {
      const name = '向量';
      const ans = answered(d, m), wrong = isWrong(d, m);
      out.push(`<span class="tag ${wrong ? 'dyn-bad' : 'dyn-ok'}">${name}門檻下被${ans ? '答' : '拒'}</span>`);
    }
    return out.join('');
  }

  function top3HTML(d) {
    if (!d.top3 || !d.top3.length) return '<p class="empty">沒有檢索結果。</p>';
    return `<ol class="top3">${d.top3.map((t, i) => {
      if (typeof t === 'string') return `<li><div class="meta">第 ${i + 1} 名</div><div class="txt">${esc(t)}</div></li>`;
      return `<li class="${t.expected ? 'exp' : ''}">
        <div class="meta">第 ${i + 1} 名・${esc(t.source)}・相似度 ${(+t.score).toFixed(3)}${t.expected ? '・<b style="color:var(--ok)">預期段落</b>' : ''}</div>
        <div class="meta">${esc(t.section)}</div>
        <div class="txt">${esc(t.text)}…</div></li>`;
    }).join('')}</ol>`;
  }

  function detailHTML(d) {
    const srcPill = d.source === 'real' ? '<span class="pill real">真實檢索資料</span>' : '<span class="pill demo">示意資料</span>';
    const lock = state.locked === d.id ? '<span class="pill lock">已鎖定</span>' : '';
    return `<div class="pid"><span class="id">${esc(d.id)}</span><span class="pill">${esc(d.category)}</span>${srcPill}${lock}</div>
      <div class="question">${esc(d.question)}</div>
      <div class="tags">${(d.tags || []).map(t => `<span class="tag neutral">${esc(t)}</span>`).join('')}${dynTags(d)}</div>
      ${d.caseId ? `<div class="list-head">題組代號：${esc(d.caseId)}</div>` : ''}
      <h3>向量相似度 vs 門檻</h3>
      ${scoreBlock(d, 'vec')}
      <h3>檢索到的 Top 3</h3>
      ${top3HTML(d)}`;
  }

  function renderBrushList() {
    if (!state.brushed.length) {
      panel.innerHTML = `<p class="empty">按下「框選模式」，在圖上拖曳出一個矩形，框到的題目會列在這裡。<br><br>滑鼠移到清單項目可以看詳細資料，點一下可以鎖定。</p>`;
      return;
    }
    const m = state.metric;
    panel.innerHTML = `<div class="list-head">框到 ${state.brushed.length} 題，依${METRICS[m].label}由高到低排列</div>` +
      state.brushed.map(id => {
        const d = byId[id];
        return `<div class="brush-item ${id === state.locked ? 'active' : ''}" data-id="${id}">
          <span class="bid">${id}</span>
          <span class="bq"><span class="sw" style="background:${answered(d) ? COLOR_ON : COLOR_OFF}"></span>${esc(d.question)}</span>
          <span class="bs">${METRICS[m].fmt(score(d))}${isWrong(d) ? ' ✗' : ''}</span></div>`;
      }).join('');
    panel.querySelectorAll('.brush-item').forEach(it => {
      const id = it.dataset.id;
      it.addEventListener('mouseenter', () => { state.hover = id; if (!state.locked) state.shown = id; renderDotsOnly(); });
      it.addEventListener('mouseleave', () => { state.hover = null; renderDotsOnly(); });
      it.addEventListener('click', () => onClick(id));
    });
  }
  // 清單 hover 時只重畫點，避免清單被重建而失去 hover
  function renderDotsOnly() { render(true); }

  /* ---------- 結論與註腳 ---------- */
  (function writeHeadline() {
    const ans = DATA.filter(d => d.expected === 'answer'), ref = DATA.filter(d => d.expected === 'refuse');
    const minA = f => Math.min(...ans.map(d => d[f])), maxR = f => Math.max(...ref.map(d => d[f]));
    const vOverlap = maxR('vecScore') - minA('vecScore');
    const c = document.getElementById('conclusion');
    c.innerHTML = vOverlap > 0
      ? `只看向量相似度，最像健康問題的應拒答題（${maxR('vecScore').toFixed(3)}）比分數最低的可回答題（${minA('vecScore').toFixed(3)}）還高 <b>${vOverlap.toFixed(3)}</b>，兩類分數重疊，門檻放哪都會誤判 → <b>所以不設相似度門檻，改用固定名額</b>：每次取前 4 段交給 LLM。`
      : `向量相似度下兩類之間相差 <b>${(-vOverlap).toFixed(3)}</b>。`;
    const real = DATA.filter(d => d.source === 'real').length;
    document.getElementById('footnote').innerHTML = real
      ? `資料說明：「健康問題」中有 ${real} 題取自 rag-檢索明細.md（cases.json 與 cases_neutral.json），向量分數為系統結果第 1 名的相似度，Top 3 為實際檢索結果；其餘 ${DATA.length - real} 題為<b>示意資料</b>，用來呈現分數重疊的情形。`
      : `資料說明：目前全部為示意資料。`;
  })();

  drawAxis();
  render();
})();
</script>
</body>
</html>
